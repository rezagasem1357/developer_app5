workflows:
  android-workflow:
    name: Android App Bundle Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate Launcher Icons
        script: |
          dart run flutter_launcher_icons
      - name: Build App Bundle (AAB)
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  web-workflow:
    name: Web Build (Karim Ahle Beit)
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Web
        script: |
          flutter build web --release
      - name: Zip web build
        script: |
          cd build/web && zip -r ../../karim_ahle_beit_web.zip . && cd ../..
    artifacts:
      - karim_ahle_beit_web.zip